[project]
name = "agent-workspace-backend"
version = "0.1.0"
description = "Reusable FastAPI + OpenAI Agents SDK foundation with a replaceable domain module"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.22.3",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sse-starlette==3.4.11",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime==1.30.0",
    "reportlab==5.0.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.26.0.51",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.15.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["models: needs model weights on disk"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
