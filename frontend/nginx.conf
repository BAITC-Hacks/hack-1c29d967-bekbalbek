server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and SSE streams go to the backend container; buffering off so events arrive as they happen.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # FastAPI's OpenAPI pages, so http://localhost:8080/docs works like it does on the dev server.
  location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
